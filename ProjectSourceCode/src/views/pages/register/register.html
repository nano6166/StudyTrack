<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Create account</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../login/login.css">
</head>

<body>
  <main class="container login-wrapper">
    <div class="login-inner">
      <header class="mb-4">
        <p class="text-primary fw-semibold mb-1">Study Track</p>
        <h1 class="h2">Create your account</h1>
        <p class="text-secondary">Track every deadline across all your courses in one place.</p>
      </header>

      <section class="auth-card p-3 p-md-4" aria-labelledby="register-heading">
        <h2 id="register-heading" class="h5 mb-3">Your details</h2>

        <div id="errorMessage" class="alert alert-danger" role="alert" hidden></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label small mb-1">Username</label>
            <input id="username" name="username" type="text" class="form-control" autocomplete="username" maxlength="100" required>
            <div id="usernameFeedback" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small mb-1">Password</label>
            <div class="input-group has-validation">
              <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" aria-describedby="passwordHint" required>
              <button id="togglePassword" class="btn btn-outline-secondary" type="button" aria-controls="password" aria-pressed="false">Show</button>
              <div id="passwordFeedback" class="invalid-feedback"></div>
            </div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label small mb-1">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" required>
            <div id="confirmPasswordFeedback" class="invalid-feedback"></div>
          </div>

          <button id="submitButton" class="btn btn-primary w-100" type="submit">Create account</button>

          <p id="status" role="status" aria-live="polite" class="text-secondary small text-center mt-3 mb-0"></p>
        </form>
      </section>

      <p class="text-secondary small text-center mt-3">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </main>

  <script src="./pages/register/register.js"></script>
</body>
</html>

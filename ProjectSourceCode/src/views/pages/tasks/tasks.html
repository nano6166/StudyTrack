<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Task breakdown</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="tasks.js" defer></script>
</head>

<body>
  <main class="container py-4" style="max-width: 720px">
    <header class="mb-4">
      <p class="text-primary fw-semibold mb-1">Study Track</p>
      <h1 id="assignmentTitle" class="h2">Task breakdown</h1>
      <p class="text-secondary">Split a big assignment into smaller steps, then check them off as you go.</p>
      <a href="../courses/courses.html">&larr; My courses</a>
    </header>

    <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
      <button id="generateButton" class="btn btn-primary" type="button">Generate with AI</button>
      <span id="status" class="text-secondary" role="status" aria-live="polite"></span>
    </div>

    <p id="errorMessage" class="alert alert-danger" role="alert" hidden></p>

    <p id="progressText" class="mb-1"></p>
    <div class="progress mb-3" role="presentation" style="height: 8px">
      <div id="progressBar" class="progress-bar bg-success" style="width: 0%"></div>
    </div>

    <p id="emptyMessage" class="text-secondary" hidden>No tasks yet. Press "Generate with AI" to get a list of smaller steps.</p>
    <ul id="taskList" class="list-group" aria-label="Tasks"></ul>
  </main>
</body>
</html>

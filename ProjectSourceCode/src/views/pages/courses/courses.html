<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | My courses</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="courses.css">
  <script src="courses.js" defer></script>
</head>

<body>
  <main class="container courses-page">
    <header class="mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <a href="courses.html">&larr; My courses</a>
        <a href="/semTotals" class="btn btn-primary">Semester totals</a>
      </div>
      <p class="text-primary fw-semibold mb-1">Study Track</p>
      <h1 class="h2">My courses</h1>
      <p class="text-secondary">Add the courses you are taking this semester.</p>
    </header>

    <section class="courses-card p-3 p-md-4 mb-4" aria-labelledby="add-heading">
      <h2 id="add-heading" class="h5 mb-3">Add a course</h2>

      <div id="errorMessage" class="alert alert-danger" role="alert" hidden></div>

      <form id="addCourseForm" class="row g-2" novalidate>
        <div class="col-md-3">
          <label for="code" class="form-label small mb-1">Course code</label>
          <input id="code" name="code" type="text" class="form-control" placeholder="CSCI 3308" maxlength="20" required>
        </div>

        <div class="col-md-6">
          <label for="name" class="form-label small mb-1">Course name</label>
          <input id="name" name="name" type="text" class="form-control" placeholder="Software Development" maxlength="100">
        </div>

        <div class="col-md-3 d-flex align-items-end">
          <button id="addButton" class="btn btn-primary w-100" type="submit">Add course</button>
        </div>
      </form>
    </section>

    <section class="courses-card p-3 p-md-4" aria-labelledby="list-heading">
      <h2 id="list-heading" class="h5 mb-3">Your courses</h2>

      <p id="status" role="status" aria-live="polite" class="text-secondary"></p>

      <ul id="courseList" class="list-group"></ul>
    </section>
  </main>
</body>
</html>

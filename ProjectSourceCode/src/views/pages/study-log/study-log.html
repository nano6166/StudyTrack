<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Log study time</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="study-log.js" defer></script>
</head>

<body>
  <main class="container py-4" style="max-width: 720px">
    <header class="mb-4">
      <p class="text-primary fw-semibold mb-1">Study Track</p>
      <h1 id="assignmentTitle" class="h2">Log study time</h1>
      <p class="text-secondary">Record how long you studied for this assignment. The minutes count toward your semester totals.</p>
      <a id="backLink" href="../courses/courses.html">&larr; Back to course</a>
    </header>

    <p id="errorMessage" class="alert alert-danger" role="alert" hidden></p>

    <form id="sessionForm" class="row g-2 align-items-end mb-3" novalidate>
      <div class="col-sm-5">
        <label for="studyDate" class="form-label">Date</label>
        <input id="studyDate" name="date" type="date" class="form-control" required>
      </div>
      <div class="col-sm-4">
        <label for="studyMinutes" class="form-label">Minutes</label>
        <input id="studyMinutes" name="minutes" type="number" min="1" max="1440" step="1" class="form-control" required>
      </div>
      <div class="col-sm-3">
        <button id="logButton" class="btn btn-primary w-100" type="submit">Log session</button>
      </div>
    </form>

    <p id="status" class="text-secondary" role="status" aria-live="polite"></p>
    <p id="totalText" class="fw-semibold"></p>

    <p id="emptyMessage" class="text-secondary" hidden>No study sessions yet.</p>
    <table id="sessionTable" class="table align-middle" hidden>
      <thead>
        <tr><th scope="col">Date</th><th scope="col">Minutes</th><th scope="col" class="text-end">Remove</th></tr>
      </thead>
      <tbody id="sessionRows"></tbody>
    </table>
  </main>
</body>
</html>

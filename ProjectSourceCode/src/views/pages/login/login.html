<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Sign in</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>

<body>
  <main class="container login-wrapper">
    <div class="login-inner">
      <header class="mb-4">
        <p class="text-primary fw-semibold mb-1">Study Track</p>
        <h1 class="h2">Sign in</h1>
        <p class="text-secondary">Sign in to see what is due across all your courses.</p>
      </header>

      <section class="auth-card p-3 p-md-4" aria-labelledby="login-heading">
        <h2 id="login-heading" class="h5 mb-3">Your account</h2>

        <div id="errorMessage" class="alert alert-danger" role="alert" hidden></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label small mb-1">Email</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
            <div id="emailFeedback" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small mb-1">Password</label>
            <div class="input-group has-validation">
              <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
              <button id="togglePassword" class="btn btn-outline-secondary" type="button" aria-controls="password" aria-pressed="false">Show</button>
              <div id="passwordFeedback" class="invalid-feedback"></div>
            </div>
          </div>

          <button id="submitButton" class="btn btn-primary w-100" type="submit">Sign in</button>

          <p id="status" role="status" aria-live="polite" class="text-secondary small text-center mt-3 mb-0"></p>

         <p class="text-secondary small text-center mt-3">
            New to Study Track? <a href="../register/register.html">Create an account</a>
          </p>

        </form>
      </section>

    </div>
  </main>
</body>
</html>

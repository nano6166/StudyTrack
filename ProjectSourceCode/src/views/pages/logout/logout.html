<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Sign out</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Reuses the card and centering styles from the login page -->
  <link rel="stylesheet" href="../login/login.css">
</head>

<body>
  <main class="container login-wrapper">
    <div class="login-inner">
      <header class="mb-4">
        <p class="text-primary fw-semibold mb-1">Study Track</p>
        <h1 class="h2">Sign out</h1>
      </header>

      <section class="auth-card p-3 p-md-4 text-center" role="status" aria-live="polite">

        <!-- Shown while the sign-out request is running -->
        <div id="working">
          <div class="spinner-border text-primary mb-3" aria-hidden="true"></div>
          <p class="mb-0">Signing you out...</p>
        </div>

        <!-- Shown once the server has ended the session -->
        <div id="done" hidden>
          <p class="fs-1 text-success mb-2" aria-hidden="true">&#10003;</p>
          <h2 class="h5">You're signed out</h2>
          <p class="text-secondary">Taking you to the sign-in page.</p>
          <a href="/login" class="btn btn-primary w-100">Sign in again</a>
        </div>

        <!-- Shown if the request fails -->
        <div id="failed" hidden>
          <div class="alert alert-danger" role="alert">
            We couldn't sign you out. Check your connection and try again.
          </div>
          <button id="retryButton" type="button" class="btn btn-primary w-100">Try again</button>
        </div>

      </section>
    </div>
  </main>

  <script>
    const working = document.querySelector("#working");
    const done = document.querySelector("#done");
    const failed = document.querySelector("#failed");
    const retryButton = document.querySelector("#retryButton");

    // Show one of the three states and hide the others
    function show(section) {
      for (const el of [working, done, failed]) {
        el.hidden = el !== section;
      }
    }

    async function signOut() {
      show(working);

      try {
        const response = await fetch("/auth/logout", {
          method: "POST",
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        show(done);
        setTimeout(() => {
          window.location.href = "/login";
        }, 2000);
      } catch (error) {
        console.error("Sign out error:", error);
        show(failed);
      }
    }

    retryButton.addEventListener("click", signOut);
    signOut();
  </script>
</body>
</html>

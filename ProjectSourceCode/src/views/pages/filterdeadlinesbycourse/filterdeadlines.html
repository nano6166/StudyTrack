
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Deadlines</title>
    <link rel="stylesheet" href="filterdeadlines.css">
</head>
<body>

    <div class="container">
        <h1>Upcoming Deadlines</h1>

        <div class="filter-container">
            <label for="courseFilter">Filter by course:</label>

            <select id="courseFilter">
                <option value="all">All courses</option>
            </select>
        </div>

        <p id="errorMessage" class="empty-message" hidden></p>

        <div id="deadlineList"></div>

        <p id="emptyMessage" class="empty-message" hidden>
            No deadlines found for this course.
        </p>
    </div>

    <script src="filterdeadlines.js"></script>
</body>
</html>

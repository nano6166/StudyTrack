<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Assignment Checklist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
  <link rel="stylesheet" href="checklist.css">
  <script src="checklist.js" defer></script>
</head>

<body>
  <main class="container checklist-page">
    <header class="mb-4">
      <p class="text-primary fw-semibold mb-1">Study Track</p>
      <h1 class="h2">Assignment checklist</h1>
      <p class="text-secondary"> Break down your assignment and track each completed step. </p>
    </header>

    <section class="checklist-card" aria-labelledby="assignmentTitle">
      <h2 id="assignmentTitle" class="h4"></h2>

      <p id="progressText" class="text-secondary"></p>

      <progress id="progressBar" class="checklist-progress" value="0" max="100" aria-label="Assignment completion"></progress>

      <div id="errorMessage" class="alert alert-danger mt-3" role="alert"  hidden></div>

      <p id="emptyMessage" class="text-secondary mt-4" hidden>Your checklist is empty.</p>

      <ul id="taskList" class="list-unstyled mt-4 mb-0" aria-label="Assignment tasks"></ul>

      <p id="saveStatus" class="small text-secondary mt-3 mb-0" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Study Sessions</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="study-log.css">
  <script src="study-log.js" defer></script>
</head>

<body>
  <main id="assignmentPage"  class="container study-page"  data-assignment-id="web-development-project" >
    <header class="mb-4">
      <p class="text-primary fw-semibold mb-1">Study Track</p>
      <h1 class="h2">Web Development Project</h1>
      <p class="text-secondary">Record the time you spend studying for this assignment.</p>
    </header>

    <section class="study-card mb-4" aria-labelledby="logHeading">
      <h2 id="logHeading" class="h4">Log a study session</h2>

      <p class="total-label">
        Total time logged:
        <span id="totalTime">0 minutes</span>
      </p>

      <div
        id="errorMessage"
        class="alert alert-danger"
        role="alert"
        hidden
      ></div>

      <form id="sessionForm">
        <div class="row g-3 align-items-end">
          <div class="col-md-5">
            <label for="sessionDate" class="form-label">
              Study date
            </label>

            <input
              id="sessionDate"
              name="sessionDate"
              type="date"
              class="form-control"
              required
            >
          </div>

          <div class="col-md-5">
            <label for="minutes" class="form-label">
              Minutes studied
            </label>

            <input  id="minutes" name="minutes" type="number" class="form-control"  min="1" step="1"  required aria-describedby="minutesHelp"></div>
          <div class="col-md-2">
            <button id="logButton"  type="submit" class="btn btn-primary w-100" > Log  </button>
          </div>
        </div>

        <p id="minutesHelp" class="form-text">Enter a whole number greater than 0. </p>
      </form>

      <p id="saveStatus" class="small text-success mb-0"  role="status" aria-live="polite"></p>
    </section>

    <section class="study-card" aria-labelledby="sessionsHeading">
      <h2 id="sessionsHeading" class="h4">Session history</h2>

      <p id="emptyMessage" class="text-secondary mb-0"> No study sessions logged yet.</p>

      <div id="sessionTableContainer" class="table-responsive" hidden>
        <table class="table align-middle mb-0">
          <caption>Study sessions for this assignment.</caption>

          <thead class="table-light">
            <tr>
              <th scope="col">Study date</th>
              <th scope="col">Minutes studied</th>
            </tr>
          </thead>

          <tbody id="sessionRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>

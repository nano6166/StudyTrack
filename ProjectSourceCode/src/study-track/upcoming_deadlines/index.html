<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Study Track | Upcoming Deadlines</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container dashboard">
    <header class="mb-4">
      <p class="text-primary fw-semibold mb-1">Study Track</p>
      <h1 class="h2">Upcoming deadlines</h1>
      <p class="text-secondary">See what is due across all your courses, closest deadline first.</p>
    </header>

    <section class="deadline-card p-3 p-md-4" aria-labelledby="deadlines-heading">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
        <div>
          <h2 id="deadlines-heading" class="h5 mb-1">Your assignments</h2>

          <p id="summary" class="text-secondary small mb-0"></p>
        </div>

        <div class="d-flex align-items-end gap-2">
          <div>
            <label for="rangeFilter" class="form-label small mb-1">Show deadlines</label>

            <select id="rangeFilter" class="form-select">
              <option value="all">All upcoming</option>
              <option value="7">Next 7 days</option>
              <option value="30">Next 30 days</option>
            </select>
          </div>

          <button id="refreshButton" class="btn btn-primary" type="button" >Refresh</button>
        </div>
      </div>

      <p id="status" role="status" aria-live="polite" class="text-secondary"></p>

      <div id="errorMessage" class="alert alert-danger" role="alert" hidden></div>

      <div id="tableContainer" class="table-responsive" hidden>
        <table class="table align-middle mb-0">
          <caption>
            Incomplete assignments with future deadlines.
            Dates are shown in your device's local timezone.
          </caption>

          <thead class="table-light">
            <tr>
              <th scope="col">Assignment</th>
              <th scope="col">Course</th>
              <th scope="col">Due date</th>
              <th scope="col">Time remaining</th>
            </tr>
          </thead>

          <tbody id="deadlineRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
